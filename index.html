// SUPABASE: updates the real tenant's status directly (Active <-> Suspended)
// and records the change in manual_billing_log for accountability. This is
// the quick pause/resume action; use "💳 Manage Billing" for plan/MRR changes.
async function toggleSuspend(id){
  const t=(_SB_CACHE.tenants||[]).find(x=>x.id===id);if(!t)return;
  const newStatus = t.status==='suspended' ? 'active' : 'suspended';
  try{
    const { data:{ user } } = await sb.auth.getUser();
    if(!user) throw new Error('Not logged in');
    const { error } = await sb.from('tenants').update({status:newStatus}).eq('id', id);
    if(error) throw error;
    const { error: logErr } = await sb.from('manual_billing_log').insert({
      tenant_id:id, changed_by:user.id,
      previous_plan:t.plan, new_plan:t.plan,
      previous_status:t.status, new_status:newStatus,
      previous_mrr:t.mrr, new_mrr:t.mrr,
      note: newStatus==='suspended' ? 'Quick-suspended from Clients list' : 'Quick-unsuspended from Clients list'
    });
    if(logErr) console.error('[NexaWage] manual_billing_log insert failed:', logErr);
    t.status = newStatus; // update cached copy so the row re-renders instantly
    toast(t.name+(newStatus==='suspended'?' suspended':' unsuspended'), newStatus==='suspended'?'info':'success');
    document.getElementById('SA-CLIENT-LIST').innerHTML=renderSAClientRows();
  }catch(err){
    console.error('[NexaWage] toggleSuspend failed:', err);
    toast('Failed to update status: '+err.message,'error');
  }
}

function genInvoice(){

  if(active.length===1){createInvoiceFor(active[0].id);return;}
  const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// SUPABASE: quick plan-only change from the Plan Subscriptions list
// (a lighter sibling of the full "💳 Manage Billing" modal on the
// Clients tab — this one skips the note/audit-log requirement, so
// use Manage Billing when you need a paper trail).
async function changePlan(id,plan){
  const t=(_SB_CACHE.tenants||[]).find(x=>x.id===id);if(!t)return;
  if(t.plan===plan)return;
  if(!confirm('Change '+t.name+' from '+t.plan+' to '+plan+'? This does not charge anyone or change MRR.')){render();return;}
  try{
    const { error } = await sb.from('tenants').update({ plan }).eq('id', id);
    if(error) throw error;
    t.plan=plan;
    toast('Plan updated to '+plan,'success');render();
  }catch(e){
    console.error('[NexaWage] changePlan failed:',e);
    toast('Failed: '+e.message,'error');
  }
}

  <div class="card">
    <div class="card-title">🏢 Client Revenue Breakdown</div>
    ${active.sort((a,b)=>toUSD(b.mrr,b.currency)-toUSD(a.mrr,a.currency)).map((t,i)=>{

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">
        ${['loans','expenses','shifts','overtime'].map(key=>`<div style="display:flex;align-items:center;justify-content:space-between;background:var(--sf2);border:1px solid var(--br);border-radius:8px;padding:8px 10px">
          <span style="font-size:11px;color:var(--tx2)">${key.charAt(0).toUpperCase()+key.slice(1)}</span>
          <label class="switch" style="transform:scale(.85)">
            <input type="checkbox"${(t.features||{})[key]?' checked':''} onchange="toggleClientFlag('${t.id}','${key}',this.checked)">
            <span class="slider"></span>
          </label>
        </div>`).join('')}
      </div>
    </div>`).join('')}
  </div>`;
}
async function toggleGlobalFlag(key,val){
  try{
    const row=await DB.setFeatureFlag(key,val);
    if(_SB_CACHE.featureFlags){const idx=_SB_CACHE.featureFlags.findIndex(f=>f.key===key);if(idx>=0)_SB_CACHE.featureFlags[idx]=row;else _SB_CACHE.featureFlags.push(row);}
    toast(key+' '+(val?'enabled':'disabled')+' globally','info');
  }catch(e){
    console.error('[NexaWage] toggleGlobalFlag failed:',e);
    toast('Failed: '+e.message,'error');render();
  }
}
// Known gap — see the in-UI note above; kept as a local-only stub so
// the per-client toggle switches don't throw when clicked.
function toggleClientFlag(tid,key,val){toast('Per-client flags aren\'t wired to Supabase yet','info');}
const toggleTenantFeature=toggleClientFlag; // alias

// ══════════════════════════════════════════════════════
//   INIT — Session Persistence
// ══════════════════════════════════════════════════════
// SUPABASE: replaces the old localStorage 'nexawage_session_final' blob.
// bootSession() calls sb.auth.getSession() (reads Supabase's own secure,
// auto-refreshing token storage), loads the role/tenant profile, and
// only then renders — so a logged-in user stays logged in across reloads
// without the app ever touching localStorage for auth state.
window.addEventListener('DOMContentLoaded',()=>{
  applyLangDir();
  bootSession();
  startClock();
});
</script>
<script>if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
