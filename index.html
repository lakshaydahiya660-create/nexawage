<!DOCTYPE html>
<html lang="en" id="HTML_ROOT">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>NexaWage — Enterprise Global SaaS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0b0f">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0b0f;--sf:#12141a;--sf2:#1a1d26;--sf3:#222633;
  --br:#2a2d3a;--br2:#343748;
  --tx:#f0f2ff;--tx2:#8b90a8;--tx3:#555a72;
  --ac:#6366f1;--ac2:#818cf8;--glow:rgba(99,102,241,.2);
  --gr:#22c55e;--rd:#ef4444;--am:#f59e0b;--bl:#3b82f6;
  --r:12px;--rs:8px;
}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tx);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:var(--sf)}::-webkit-scrollbar-thumb{background:var(--br2);border-radius:2px}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{background:var(--sf);border-bottom:1px solid var(--br);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10}
.tb-logo{font-family:'Syne',sans-serif;font-size:17px;font-weight:800}
.tb-logo span{color:var(--ac2)}
.tb-time{white-space:nowrap;margin-left:auto;font-size:11.5px;color:var(--tx2);background:var(--sf2);padding:4px 10px;border-radius:20px;border:1px solid var(--br)}
.tb-av{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;cursor:pointer;flex-shrink:0}
.page{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;padding-bottom:90px;-webkit-overflow-scrolling:touch}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--sf);border-top:1px solid var(--br);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom)}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:9px 2px;color:var(--tx3);font-size:9.5px;font-weight:700;gap:2px;border:none;background:none;cursor:pointer;transition:color .2s;letter-spacing:.2px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.bn.active{color:var(--ac2)}
.bn-ic{font-size:19px;line-height:1}
.card{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:14px;margin-bottom:10px}
.card-title{font-family:'Syne',sans-serif;font-size:13.5px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:7px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}
.sg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:12px}
.sg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:9px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:13px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.stat.ind::before{background:linear-gradient(90deg,#6366f1,#818cf8)}
.stat.grn::before{background:linear-gradient(90deg,#22c55e,#4ade80)}
.stat.amb::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.stat.blu::before{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.stat.pnk::before{background:linear-gradient(90deg,#ec4899,#f472b6)}
.stat.pur::before{background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
.stat-lbl{font-size:9.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.stat-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;line-height:1}
.stat-sub{font-size:10px;color:var(--tx3);margin-top:3px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:var(--rs);font-size:13px;font-weight:600;border:1px solid transparent;transition:all .2s;cursor:pointer;width:100%;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn-p{background:var(--ac);color:#fff}.btn-p:active{opacity:.85}
.btn-s{background:var(--sf2);color:var(--tx2);border-color:var(--br)}.btn-s:active{background:var(--sf3)}
.btn-g{background:rgba(34,197,94,.1);color:var(--gr);border-color:rgba(34,197,94,.3)}
.btn-d{background:rgba(239,68,68,.1);color:var(--rd);border-color:rgba(239,68,68,.3)}
.btn-am{background:rgba(245,158,11,.1);color:var(--am);border-color:rgba(245,158,11,.3)}
.btn-bl{background:rgba(59,130,246,.1);color:var(--bl);border-color:rgba(59,130,246,.3)}
.btn-sm{padding:5px 11px;font-size:12px;width:auto}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.fg{margin-bottom:11px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
.fi{width:100%;background:var(--sf2);border:1px solid var(--br);border-radius:var(--rs);color:var(--tx);font-size:13px;padding:8px 11px;outline:none;font-family:inherit;transition:border .2s;-webkit-appearance:none;min-height:44px}
.fi:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
.fi::placeholder{color:var(--tx3)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--br)}
.toggle-row:last-child{border-bottom:none}
.toggle-lbl{font-size:13px;color:var(--tx2)}
.toggle-lbl small{display:block;font-size:10.5px;color:var(--tx3);margin-top:1px}
.switch{position:relative;width:44px;height:24px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{position:absolute;inset:0;background:var(--sf3);border-radius:12px;cursor:pointer;transition:.3s;border:1px solid var(--br2)}
.slider::before{content:'';position:absolute;width:18px;height:18px;left:2px;top:2px;background:var(--tx3);border-radius:50%;transition:.3s}
input:checked+.slider{background:var(--ac);border-color:var(--ac)}
input:checked+.slider::before{transform:translateX(20px);background:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700}
.badge::before{content:'';width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0}
.b-present{background:rgba(34,197,94,.12);color:#22c55e}
.b-absent{background:rgba(239,68,68,.12);color:#ef4444}
.b-half{background:rgba(245,158,11,.12);color:#f59e0b}
.b-leave{background:rgba(99,102,241,.12);color:#818cf8}
.b-paid{background:rgba(34,197,94,.12);color:#22c55e}
.b-pending{background:rgba(245,158,11,.12);color:#f59e0b}
.b-approved{background:rgba(34,197,94,.12);color:#22c55e}
.b-rejected{background:rgba(239,68,68,.12);color:#ef4444}
.b-notice{background:rgba(245,158,11,.12);color:#f59e0b}
.b-offboarded{background:rgba(239,68,68,.12);color:#ef4444}
.b-morning{background:rgba(245,158,11,.12);color:#f59e0b}
.b-evening{background:rgba(59,130,246,.12);color:#60a5fa}
.b-night{background:rgba(139,92,246,.12);color:#a78bfa}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;font-weight:700;color:#fff;flex-shrink:0}
.av-sm{width:28px;height:28px;font-size:10px;border-radius:7px}
.av-md{width:36px;height:36px;font-size:13px}
.av-lg{width:50px;height:50px;font-size:17px;border-radius:13px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--br)}
.li:last-child{border-bottom:none}
.li-body{flex:1;min-width:0}
.li-title{font-size:13px;font-weight:600;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li-sub{font-size:11px;color:var(--tx3);margin-top:1px}
.li-right{text-align:right;flex-shrink:0}
.ir{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--br);font-size:13px}
.ir:last-child{border-bottom:none}
.ir-l{color:var(--tx2)}
.ir-v{font-weight:600;color:var(--tx);text-align:right}
.sc-card{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.sc-header{padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none;min-height:44px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.sc-arrow{margin-left:auto;color:var(--tx3);font-size:14px;transition:transform .25s}
.sc-arrow.open{transform:rotate(180deg)}
.sc-body{padding:0 14px 14px;display:none}
.sc-body.open{display:block}
.sc-section{margin-bottom:14px}
.sc-section-title{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--br)}
.sc-field{display:flex;align-items:center;gap:8px;margin-bottom:8px;min-height:44px}
.sc-field label{font-size:12px;color:var(--tx2);flex:1;font-weight:500}
.sc-field input{width:100px;background:var(--sf2);border:1px solid var(--br);border-radius:var(--rs);color:var(--tx);font-size:13px;font-weight:700;padding:7px 9px;outline:none;font-family:inherit;text-align:right;-webkit-appearance:none;transition:border .2s;min-height:44px}
.sc-field input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
.sc-field .unit{font-size:11px;color:var(--tx3);width:22px;text-align:left;font-weight:600}
.net-preview{background:linear-gradient(135deg,rgba(99,102,241,.1),rgba(129,140,248,.05));border:1px solid rgba(99,102,241,.25);border-radius:var(--rs);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.net-lbl{font-size:10px;font-weight:700;color:var(--ac2);text-transform:uppercase;letter-spacing:.5px}
.net-val{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--ac2)}
.breakdown-row{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;color:var(--tx2)}
.breakdown-row span:last-child{font-weight:600;color:var(--tx)}
.breakdown-row.ded span:last-child{color:var(--rd)}
.breakdown-row.bon span:last-child{color:var(--gr)}
.breakdown-row.total{font-weight:700;color:var(--tx);font-size:13px;padding-top:6px;border-top:1px solid var(--br);margin-top:4px}
.breakdown-row.total span:last-child{color:var(--ac2);font-size:15px}
.sheet-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:flex-end}
.sheet{background:var(--sf);border-radius:20px 20px 0 0;width:100%;max-height:88vh;overflow-y:auto;padding:18px 16px 40px;-webkit-overflow-scrolling:touch}
.sheet-handle{width:36px;height:4px;background:var(--br2);border-radius:2px;margin:0 auto 14px}
.sheet-title{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;margin-bottom:16px}
.clock-widget{background:linear-gradient(135deg,#1a1d26,#0f1219);border:1px solid var(--br);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:12px;position:relative;overflow:hidden}
.clock-widget::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(99,102,241,.08),transparent 60%);pointer-events:none}
.clock-big{font-family:'Syne',sans-serif;font-size:clamp(28px,9.5vw,40px);white-space:nowrap;font-weight:800;letter-spacing:-2px;line-height:1;margin:8px 0;position:relative}
.clock-dt{font-size:12px;color:var(--tx2);margin-bottom:18px;position:relative}
.clock-btn{width:80px;height:80px;border-radius:50%;border:3px solid;cursor:pointer;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;transition:all .3s;background:none;position:relative;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.clock-btn.out{border-color:var(--ac);color:var(--ac2)}.clock-btn.out:active{transform:scale(.95);box-shadow:0 0 28px var(--glow)}
.clock-btn.in{border-color:var(--gr);color:var(--gr)}.clock-btn.in:active{transform:scale(.95)}
.clock-row{display:flex;justify-content:space-around;padding-top:14px;border-top:1px solid var(--br);position:relative}
.cs{text-align:center}.cs-l{font-size:9.5px;color:var(--tx3);font-weight:700;text-transform:uppercase;letter-spacing:.4px}.cs-v{font-size:13px;font-weight:700;color:var(--tx2);margin-top:2px}.cs-v.gr{color:var(--gr)}
.ps{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);overflow:hidden}
.ps-head{background:linear-gradient(135deg,#1a1c2e,#1f2235);padding:14px}
.ps-company{font-family:'Syne',sans-serif;font-size:16px;font-weight:800}
.ps-net-box{background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);border-radius:var(--rs);padding:12px 14px;margin:10px 0;display:flex;justify-content:space-between;align-items:center}
.ps-net-lbl{font-size:10px;font-weight:700;color:var(--ac2);text-transform:uppercase;letter-spacing:.5px}
.ps-net-val{font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--ac2)}
.ps-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--br);font-size:12.5px}
.ps-row:last-child{border:none}
.ps-lbl{color:var(--tx2)}.ps-val{font-weight:600;color:var(--tx)}.ps-val.ded{color:var(--rd)}.ps-val.bon{color:var(--gr)}
.search-bar{display:flex;align-items:center;gap:8px;background:var(--sf2);border:1px solid var(--br);border-radius:var(--rs);padding:8px 11px;margin-bottom:12px;min-height:44px}
.search-bar input{background:none;border:none;color:var(--tx);font-size:13px;outline:none;flex:1;font-family:inherit}
.search-bar input::placeholder{color:var(--tx3)}
.flex{display:flex}.fxc{align-items:center}.fxb{justify-content:space-between}
.gap2{gap:8px}.gap3{gap:12px}
.mb3{margin-bottom:12px}.mt3{margin-top:12px}.mb2{margin-bottom:8px}
.mla{margin-left:auto}
.dept{display:inline-block;padding:2px 7px;background:var(--sf3);border-radius:4px;font-size:10.5px;color:var(--tx2);border:1px solid var(--br)}
.divider{border:none;border-top:1px solid var(--br);margin:10px 0}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;gap:8px;color:var(--tx3);font-size:13px;text-align:center}
.empty-icon{font-size:32px;opacity:.3}
.fade{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.highlight-box{background:var(--sf2);border:1px solid var(--br);border-radius:var(--rs);padding:10px 12px;margin-bottom:10px}
.section-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title{font-family:'Syne',sans-serif;font-size:17px;font-weight:800}
.toast-c{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:999;pointer-events:none;width:90%;max-width:340px}
.toast{background:var(--sf);border:1px solid var(--br);border-radius:var(--r);padding:10px 14px;margin-bottom:8px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,0,0,.5);animation:slideDown .3s ease}
.toast.success{border-color:rgba(34,197,94,.4);color:var(--gr)}
.toast.error{border-color:rgba(239,68,68,.4);color:var(--rd)}
.toast.info{border-color:rgba(99,102,241,.4);color:var(--ac2)}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.login-wrap{min-height:100vh;background:radial-gradient(ellipse at 30% 20%,rgba(99,102,241,.08),transparent 50%),var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--sf);border:1px solid var(--br);border-radius:20px;padding:28px 20px;width:100%;max-width:380px}
.login-mark{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;text-align:center}
.login-mark span{color:var(--ac2)}
.switcher{display:flex;background:var(--sf2);border-radius:var(--rs);padding:3px;margin:16px 0}
.sw{flex:1;padding:8px;border:none;border-radius:6px;font-size:13px;font-weight:600;color:var(--tx2);background:none;cursor:pointer;transition:all .2s;min-height:44px;touch-action:manipulation}
.sw.active{background:var(--sf3);color:var(--tx)}
.hint{background:var(--sf2);border:1px solid var(--br);border-left:3px solid var(--ac);border-radius:var(--rs);padding:8px 11px;font-size:11.5px;color:var(--tx3);margin-bottom:14px}
/* RTL */
[dir="rtl"] .bottom-nav{direction:rtl}
[dir="rtl"] .topbar{direction:rtl}
[dir="rtl"] .li-right{text-align:left}
[dir="rtl"] .ir{flex-direction:row-reverse}
[dir="rtl"] .ir-v{text-align:left}
[dir="rtl"] .sc-arrow{margin-left:0;margin-right:auto}
[dir="rtl"] .sc-field{flex-direction:row-reverse}
[dir="rtl"] .sc-field label{text-align:right}
[dir="rtl"] .card-title{flex-direction:row-reverse}
[dir="rtl"] .section-hdr{flex-direction:row-reverse}
[dir="rtl"] .btn-row{direction:rtl}
[dir="rtl"] .badge::before{margin-left:4px;margin-right:0}
[dir="rtl"] .hint{border-left:none;border-right:3px solid var(--ac)}
[dir="rtl"] body{font-family:'DM Sans','Segoe UI',Tahoma,sans-serif}
/* Export */
.export-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.btn-pdf{background:linear-gradient(135deg,rgba(99,102,241,.18),rgba(129,140,248,.10));color:var(--ac2);border:1px solid rgba(99,102,241,.4);border-radius:var(--rs);padding:11px 10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .2s;width:100%;min-height:44px;touch-action:manipulation}
.btn-pdf:active{opacity:.8;transform:scale(.97)}
.btn-email{background:linear-gradient(135deg,rgba(34,197,94,.12),rgba(74,222,128,.06));color:var(--gr);border:1px solid rgba(34,197,94,.35);border-radius:var(--rs);padding:11px 10px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:all .2s;width:100%;min-height:44px;touch-action:manipulation}
.btn-email:active{opacity:.8;transform:scale(.97)}
/* Doc Vault */
.doc-vault-section{margin-top:14px;padding-top:14px;border-top:1px solid var(--br)}
.doc-vault-title{font-size:10px;font-weight:800;color:var(--tx3);text-transform:uppercase;letter-spacing:.7px;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.doc-item{background:var(--sf2);border:1px solid var(--br);border-radius:var(--rs);padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.doc-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;background:var(--sf3)}
.doc-body{flex:1;min-width:0}
.doc-name{font-size:12.5px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-sub{font-size:10.5px;color:var(--tx3);margin-top:1px}
.doc-status-btn{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:10.5px;font-weight:700;border:none;cursor:pointer;transition:all .2s}
.doc-pending{background:rgba(245,158,11,.12);color:#f59e0b}
.doc-verified{background:rgba(34,197,94,.12);color:#22c55e}
.doc-rejected{background:rgba(239,68,68,.12);color:#ef4444}
.doc-upload-btn{background:var(--sf3);border:1px dashed var(--br2);border-radius:var(--rs);padding:8px 10px;font-size:11.5px;color:var(--tx2);cursor:pointer;width:100%;text-align:center;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px}

<script>
// ============================================================
// SUPABASE INTEGRATION — added to replace localStorage/mock auth
// See nexawage_schema.sql for the matching database migration.
// ============================================================
const SUPABASE_URL = 'https://mfmysmqfozjddekpkiwl.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1mbXlzbXFmb3pqZGRla3BraXdsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNzA5MjUsImV4cCI6MjEwMzc0NjkyNX0.4ylPvFLs5d-q44z-2-c0oL3UAHAND26sCDgMok-09jw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

// Calls a Supabase Edge Function with the signed-in user's own access
// token (never the anon key alone) so the function's callerProfile()
// helper can verify who is asking. Used by billing checkout/portal
// and the payslip email button.
async function _edgeFn(name, payload){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) throw new Error('Not signed in');
  const res = await fetch(SUPABASE_URL+'/functions/v1/'+name, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },
    body: JSON.stringify(payload)
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || (name+' failed ('+res.status+')'));
  return data;
}

// Replaces ST.user + the old localStorage 'nexawage_session_final' blob.
const SESSION = { user: null, profile: null, employee: null, loading: true };

async function loadSessionProfile(authUser){
  SESSION.user = authUser;
  const { data: profile, error: pErr } = await sb.from('profiles').select('*').eq('id', authUser.id).single();
  if (pErr || !profile) return false;
  SESSION.profile = profile;

  // Trial / subscription gate. Runs for every sign-in AND every page-reload
  // restore. Fails CLOSED: if the status cannot be verified, access is denied.
  SESSION.blockReason = null; SESSION.access = null;
  if (profile.role !== 'super_admin'){
    const { data: acc, error: aErr } = await sb.rpc('my_tenant_access');
    if (aErr || !acc){
      console.error('[NexaWage] my_tenant_access failed:', aErr);
      SESSION.blockReason = 'Could not verify your account status. Please try again.';
      SESSION.profile = null;
      return false;
    }
    if (!acc.allowed){
      const MSG = {
        trial_expired:'Your 14-day free trial has ended. Please contact support to upgrade your plan.',
        suspended:'This company account is suspended. Please contact support.',
        cancelled:'This company account has been cancelled. Please contact support.',
        no_tenant:'No company is linked to this account. Contact your administrator.'
      };
      SESSION.blockReason = MSG[acc.reason] || 'Access to this account is not available. Please contact support.';
      SESSION.profile = null;
      return false;
    }
    SESSION.access = acc;
  }
  if (profile.role === 'employee' && profile.employee_id){
    const { data: emp } = await sb.from('employees').select('*').eq('id', profile.employee_id).single();
    SESSION.employee = emp || null;
  }
  return true;
}

// Call once at boot, before the first render(). Restores session on page reload.
async function bootSession(){
  SESSION.loading = true;
  const { data:{ session } } = await sb.auth.getSession();
  if (session && session.user){
    const ok = await loadSessionProfile(session.user);
    if (!ok) await sb.auth.signOut();
  }
  SESSION.loading = false;
  sb.auth.onAuthStateChange(async (event)=>{
    if (event === 'SIGNED_OUT'){
      SESSION.user=null; SESSION.profile=null; SESSION.employee=null;
      Object.keys(_SB_CACHE).forEach(k=>{ _SB_CACHE[k] = k.endsWith('Loading') ? false : null; });
      ST.user=null; ST.page='login'; renderAsync();
    }
  });
  if (SESSION.profile){
    ST.user = { role: SESSION.profile.role, name: SESSION.profile.full_name || SESSION.profile.email, email: SESSION.profile.email, empId: SESSION.profile.employee_id };
    ST.page = SESSION.profile.role==='super_admin' ? 'super-admin' : (SESSION.profile.role==='admin' ? 'dashboard' : 'emp-home');
  }
  renderAsync();
}

// RBAC guard — which roles may view which page.
const PAGE_ACCESS = {
  'super-admin':['super_admin'], dashboard:['admin'], 'salary-ctrl':['admin'], employees:['admin'],
  attendance:['admin'], payroll:['admin'], 'dept-browser':['admin'], 'leaves-admin':['admin'],
  'loans-admin':['admin'], 'expenses-admin':['admin'], 'shifts-admin':['admin'],
  'emp-home':['employee'], 'emp-attend':['employee'], 'emp-pay':['employee'], 'emp-leave':['employee'],
  'emp-loans':['employee'], 'emp-expenses':['employee']
};
function canAccess(page){
  const allowed = PAGE_ACCESS[page];
  if (!allowed) return true;
  return !!SESSION.profile && allowed.includes(SESSION.profile.role);
}

// Async data-access layer — replaces gS()/sS()/gSA()/sSA() for the
// tables that have been migrated. Tenant scoping is enforced by RLS;
// .eq('tenant_id', ...) is included for clarity/index usage.
// SUPABASE: calls the create-employee-user Edge Function (see
// supabase-functions/create-employee-user/index.ts). Sends the
// current admin's own access token as the Authorization header — the
// function verifies that token server-side and checks the caller is
// actually an admin/super_admin before doing anything privileged.
async function callCreateEmployeeUser({ email, password, full_name, tenant_id, role, employee_id }){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) throw new Error('Not logged in');
  const res = await fetch(SUPABASE_URL+'/functions/v1/create-employee-user', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },
    body: JSON.stringify({ email, password, full_name, tenant_id, role, employee_id })
  });
  const json = await res.json();
  if(!res.ok) throw new Error(json.error || 'Edge Function request failed ('+res.status+')');
  return json;
}

const DB = {
  tenantId: () => SESSION.profile && SESSION.profile.tenant_id,

  async getEmployees(){
    const { data, error } = await sb.from('employees').select('*').eq('tenant_id', DB.tenantId()).order('full_name');
    if (error) throw error; return data;
  },
  async upsertEmployee(emp){
    // FIX: Postgres validates NOT NULL columns (like full_name) on the
    // INSERT branch of an upsert even when the row already exists and
    // the conflict path will just UPDATE — so a partial payload like
    // {id, bank_account_no} used to fail with "null value in column
    // full_name violates not-null constraint". Real UPDATE when `id`
    // is present avoids this entirely; only INSERT needs the full row.
    const payload = Object.assign({}, emp, { tenant_id: DB.tenantId() });
    if (payload.id) {
      const id = payload.id;
      delete payload.id;
      delete payload.tenant_id; // never move a row between tenants via this path
      const { data, error } = await sb.from('employees').update(payload).eq('id', id).select().single();
      if (error) throw error; return data;
    }
    const { data, error } = await sb.from('employees').insert(payload).select().single();
    if (error) throw error; return data;
  },
  async deactivateEmployee(employeeId, lastWorkingDay){
    const { error } = await sb.from('employees').update({ status:'offboarded', is_active:false, last_working_day:lastWorkingDay }).eq('id', employeeId).eq('tenant_id', DB.tenantId());
    if (error) throw error;
  },
  async getAttendance({ employeeId, month, year } = {}){
    let q = sb.from('attendance').select('*').eq('tenant_id', DB.tenantId());
    if (employeeId) q = q.eq('employee_id', employeeId);
    if (month && year){
      const start = year+'-'+String(month).padStart(2,'0')+'-01';
      const end = monthEnd(year, month);
      q = q.gte('date', start).lte('date', end);
    }
    const { data, error } = await q.order('date', { ascending:false });
    if (error) throw error; return data;
  },
  async clockIn(employeeId, geo){
    const date = localDate();
    const { data: ex } = await sb.from('attendance').select('*').eq('employee_id', employeeId).eq('date', date).maybeSingle();
    if (ex && ex.check_out) throw new Error('Already clocked out for today');
    if (ex && ex.check_in) return ex; // never overwrite the original clock-in time
    const { data, error } = await sb.from('attendance').upsert({
      tenant_id: DB.tenantId(), employee_id: employeeId, date,
      check_in: new Date().toISOString(), status:'present', geo_location: geo || null
    }, { onConflict: 'tenant_id,employee_id,date' }).select().single();
    if (error) throw error; return data;
  },
  async clockOut(employeeId){
    const today = localDate();
    const { data: row } = await sb.from('attendance').select('*').eq('employee_id', employeeId).eq('date', today).single();
    if (!row || !row.check_in) throw new Error('No check-in found for today');
    if (row.check_out) throw new Error('Already clocked out today');
    const checkOutTime = new Date();
    const hours = (checkOutTime - new Date(row.check_in)) / 3600000;
    const { data, error } = await sb.from('attendance').update({
      check_out: checkOutTime.toISOString(), hours_worked: Math.round(hours*100)/100,
      ot_hours: Math.max(0, Math.round((hours-((SHIFTS[(SESSION.employee&&SESSION.employee.shift)?SESSION.employee.shift.charAt(0).toUpperCase()+SESSION.employee.shift.slice(1):'General']||SHIFTS.General).hours))*100)/100)
    }).eq('id', row.id).select().single();
    if (error) throw error; return data;
  },
  async runPayroll({ employeeId, month, year, gross, deductions, net, breakdown }){
    const { data, error } = await sb.from('payroll_runs').upsert({
      tenant_id: DB.tenantId(), employee_id: employeeId, month, year,
      gross_earnings: gross, total_deductions: deductions, net_pay: net, breakdown,
      status:'processed', processed_at: new Date().toISOString()
    }, { onConflict: 'tenant_id,employee_id,month,year' }).select().single();
    if (error) throw error; return data;

    const { data: loan, error: e1 } = await sb.from('loans').select('*').eq('id',loanId).single();
    if (e1) throw e1;
    const newBalance = Math.max(0, loan.remaining_balance - loan.emi_amount);
    const newStatus = newBalance<=0 ? 'closed' : loan.status;

  async upsertAttendance({ employeeId, date, status, checkIn, checkOut, hours, otHours }){
    const payload = {
      tenant_id: DB.tenantId(), employee_id: employeeId, date, status,
      hours_worked: hours || 0, ot_hours: otHours || 0,
    };
    // check_in/check_out are timestamptz in the schema; the UI only
    // collects a plain HH:MM, so combine it with `date` to make a
    // real timestamp (kept simple — no timezone conversion attempted).
    if (checkIn) payload.check_in = new Date(date+'T'+checkIn+':00').toISOString();
    if (checkOut) payload.check_out = new Date(date+'T'+checkOut+':00').toISOString();
    const { data, error } = await sb.from('attendance').upsert(payload, { onConflict: 'tenant_id,employee_id,date' }).select().single();
    if (error) throw error; return data;
  },

function getLang(){ try{ const s=gS(); return s.language||'en'; }catch{ return 'en'; } }
function t(key){ const lang=getLang(); return (TRANSLATIONS[lang]&&TRANSLATIONS[lang][key])||TRANSLATIONS['en'][key]||key; }
function applyLangDir(){
  const lang=getLang();
  const root=document.getElementById('HTML_ROOT');
  if(root){root.lang=lang;root.dir=lang==='ar'?'rtl':'ltr';}
}
function setLang(lang){
  if(!TRANSLATIONS[lang]){toast('Language not available','error');return;}
  const s=gS(); s.language=lang; sS(s);
  const names={en:'English',hi:'हिन्दी',ar:'العربية',es:'Español',fr:'Français',de:'Deutsch'};
  toast('🌐 Language set to '+(names[lang]||lang),'success');
  closeSheet();
  applyLangDir();
  render();
  startClock();
}

//   SALARY CALCULATION ENGINE
// ══════════════════════════════════════════════════════
function calcTDS(gross){
  if(!gross)return 0;
  const slabs=[{u:25000,r:0},{u:50000,r:.05},{u:75000,r:.1},{u:100000,r:.15},{u:125000,r:.2},{u:Infinity,r:.3}];
  let rem=gross,tax=0,prev=0;
  for(const sl of slabs){if(rem<=0)break;const lim=Math.min(sl.u,gross);const amt=Math.min(rem,lim-prev);tax+=amt*sl.r;rem-=amt;prev=sl.u;}
  return Math.round(tax);
}
// SUPABASE: helper — real attendance rows for one employee in a
// month, read from _SB_CACHE.attendance (attendance table) instead
// of the old gS().attendance blob. Falls back to an empty array if
// the cache hasn't loaded yet (callers should ensure it's loaded
// before running payroll math — see pgPayroll/pgDashboard/markPaid).
function _attRecsFor(empId, month, year){
  const start=`${year}-${String(month).padStart(2,'0')}-01`;
  const end=monthEnd(year,month);
  return (_SB_CACHE.attendance||[]).filter(a=>a.employee_id===empId&&a.date>=start&&a.date<=end);
}
// SUPABASE: global platform flags (feature_flags table), same shape
// gS().features used to provide, but real/shared/DB-backed. Defaults
// to "on" for a flag that hasn't loaded yet or was never seeded, so
// missing data never silently disables a paid feature.
function _flagOn(key){
  if(!_SB_CACHE.featureFlags) return true;
  const row=_SB_CACHE.featureFlags.find(f=>f.key===key);
  return row ? row.enabled!==false : true;
}
function calcOT(emp, month, year){
  const recs=_attRecsFor(emp.id,month,year).filter(a=>a.status==='present');
  const shiftInfo=SHIFTS[emp.shift||'General']||SHIFTS.General;
  const stdHours=shiftInfo.hours;
  let totalOtHours=0;
  recs.forEach(r=>{
    const logged=r.hours_worked||0;
    const ot=Math.max(0,logged-stdHours);
    totalOtHours+=ot;
  });
  const dailyRate=(parseFloat(emp.sal?.basic||0))/(getWorkingDays(year,month)||26);
  const hourlyRate=dailyRate/stdHours;
  const otPay=Math.round(totalOtHours*hourlyRate*OT_RATE);
  return {otHours:parseFloat(totalOtHours.toFixed(2)),otPay};
}
// SUPABASE: reads _SB_CACHE.expenses (expenses table). The schema's
// expense_status enum already has a 'paid' state, so — per the
// existing design decision noted at _loadExpensesCache — an expense
// simply stops showing up here once an admin marks it 'paid'
// (setExpenseStatus), rather than needing a separate payslip-link flag.
function getApprovedExpenses(empId, month, year){
  const start=`${year}-${String(month).padStart(2,'0')}-01`;
  const end=monthEnd(year,month);
  return (_SB_CACHE.expenses||[]).filter(e=>e.employee_id===empId&&e.status==='approved'&&e.created_at>=start&&e.created_at<=end+'T23:59:59');
}
// SUPABASE: reads _SB_CACHE.loans (loans table). A loan stays
// status='approved' for its whole repayment life and only becomes
// 'closed' once remaining_balance hits 0 (see DB.recordLoanEMI) — so
// "active" here means approved AND still owing money.
function getActiveLoanEMI(empId){
  const loan=(_SB_CACHE.loans||[]).find(l=>l.employee_id===empId&&l.status==='approved'&&l.remaining_balance>0);
  return loan?loan.emi_amount:0;
}
function calcEmpPayroll(emp, month, year){
  const cfg=emp.sal||{};
  const basic=parseFloat(cfg.basic)||0;
  const wdays=getWorkingDays(year,month);
  const daily=basic/wdays;
  const recs=_attRecsFor(emp.id,month,year);
  let worked=0,unpaidDays=0;
  recs.forEach(r=>{
    if(r.status==='present')worked+=1;
    else if(r.status==='half')worked+=.5;
    else if(r.status==='leave')worked+=1;
    else if(r.status==='absent')unpaidDays+=1;
  });
  const gross=Math.round(daily*worked);
  const hra=parseFloat(cfg.hra)||0;
  const special=parseFloat(cfg.special)||0;
  const bonus=parseFloat(cfg.bonus)||0;
  // OT
  const otCalc=_flagOn('overtime')?calcOT(emp,month,year):{otHours:0,otPay:0};
  const otEarnings=otCalc.otPay;
  // Expenses reimbursement
  const expList=_flagOn('expenses')?getApprovedExpenses(emp.id,month,year):[];
  const expReimb=expList.reduce((a,e)=>a+(parseFloat(e.amount)||0),0);
  const totalEarnings=gross+hra+special+bonus+otEarnings+expReimb;
  // Deductions
  let pf=0;
  if(cfg.pfMode==='percent'){
    const pfBasic=Math.round(basic*.40);
    pf=Math.round(pfBasic*(parseFloat(cfg.pfVal)||12)/100);
    if(cfg.pfCap&&pf>1800)pf=1800;
  } else {
    pf=parseFloat(cfg.pfVal)||0;
  }
  const esi=cfg.esiEnabled?Math.round(gross*(parseFloat(cfg.esiRate)||0.75)/100):0;
  const pt=cfg.ptEnabled?(parseFloat(cfg.ptAmt)||0):0;
  const tds=cfg.tdsEnabled?calcTDS(gross):0;
  const unpaid=Math.round(daily*unpaidDays);
  const customDed=parseFloat(cfg.customDed)||0;
  const loanEmi=_flagOn('loans')?getActiveLoanEMI(emp.id):0;
  const totalDed=pf+esi+pt+tds+unpaid+customDed+loanEmi;
  const net=Math.max(0,totalEarnings-totalDed);
  return {gross,hra,special,bonus,otEarnings,expReimb,totalEarnings,pf,esi,pt,tds,unpaid,customDed,loanEmi,totalDed,net,worked,wdays,daily:Math.round(daily),otHours:otCalc.otHours};
}

// SUPABASE + STRICT PORTAL ENFORCEMENT
// Replaces doLogin() in index.html. The role stored in `profiles` must
// exactly match the portal tab (ST.loginMode) the user signed in from.
async function doLogin(){
  const e=(document.getElementById('LE')||{}).value?.trim().toLowerCase()||'';
  const p=(document.getElementById('LP')||{}).value||'';
  const btn=document.getElementById('LOGIN-BTN');

  // Snapshot the selected portal NOW. If the user taps another tab while the
  // network call is in flight, the check below still uses the tab they
  // actually submitted from.
  const portal=ST.loginMode;
  const ROLE_LABEL={ employee:'an Employee', admin:'an Admin', super_admin:'a Super Admin' };

  // Look #LERR up fresh every time: signOut() fires SIGNED_OUT, whose handler
  // re-renders the login screen and replaces the old element (a cached
  // reference would write the error into a detached node = invisible).
  const clearErr=()=>{ const el=document.getElementById('LERR'); if(el) el.style.display='none'; };
  const showErr=(msg)=>{ const el=document.getElementById('LERR'); if(el){ el.style.display='block'; el.textContent=msg; } };
  clearErr();

  if(!e||!p){ showErr('Enter both email and password.'); return; }
  if(!ROLE_LABEL[portal]){ showErr('Select a login portal (Employee, Admin or Super) and try again.'); return; }

  // Block double-submit (rapid double-tap on mobile).
  if(btn){ btn.disabled=true; btn.textContent='Signing in…'; }

  const wipeLocalSession=()=>{ SESSION.user=null; SESSION.profile=null; SESSION.employee=null; ST.user=null; };

  // Fail-closed teardown: wipe local state, kill the Supabase session, then
  // show the reason. Local state is wiped BEFORE signOut so it is clean even
  // if signOut throws (offline), and again after.
  const denyAndSignOut=async(msg)=>{
    wipeLocalSession();
    try{ await sb.auth.signOut(); }
    catch(so){ console.error('[NexaWage] signOut failed during deny:', so); }
    wipeLocalSession();
    await new Promise(r=>setTimeout(r,0));          // let the SIGNED_OUT re-render finish
    const le=document.getElementById('LE');          // re-render blanks the inputs;
    if(le && !le.value) le.value=e;                  // keep the email so they can retry
    showErr(msg);
  };

  try{
    const { data, error } = await sb.auth.signInWithPassword({ email:e, password:p });

    if(error){
      console.error('[NexaWage] signInWithPassword error:', error);
      const msg=(error.message||'').toLowerCase();
      if(msg.includes('email not confirmed')){
        showErr('Email not confirmed yet. Confirm it in Supabase → Authentication → Users, or disable "Confirm email" for testing.');
      } else if(msg.includes('invalid login credentials')){
        showErr('Email or password is incorrect, or this user has no password set in Supabase Auth.');
      } else if(msg.includes('fetch')||msg.includes('network')){
        showErr('Could not reach Supabase — check SUPABASE_URL/SUPABASE_ANON_KEY at the top of the file and your internet connection.');
      } else {
        showErr(error.message || t('invalidCredentials'));
      }
      return;
    }

    const ok = await loadSessionProfile(data.user);
    if(!ok){
      if(SESSION.blockReason){ await denyAndSignOut(SESSION.blockReason); return; }
      console.error('[NexaWage] Auth succeeded but no profiles row for', data.user.id);
      await denyAndSignOut('Login succeeded but no profile/role is set up for this account. Run: update profiles set tenant_id=..., role=... where email=\''+e+'\';');
      return;
    }

    // ── PORTAL ENFORCEMENT ─────────────────────────────────────────
    const actualRole=SESSION.profile.role;   // exact value from the database, no normalising

    if(!ROLE_LABEL[actualRole]){             // null / typo / unknown role: fail closed
      await denyAndSignOut('Access Denied: your account has no valid role assigned. Contact your administrator.');
      return;
    }
    if(actualRole!==portal){
      await denyAndSignOut('Access Denied: You are '+ROLE_LABEL[actualRole]+'. Please select the correct portal tab to log in.');
      return;
    }
    // ───────────────────────────────────────────────────────────────

    if(actualRole==='employee'){
      // Previously an employee profile with a missing employees row fell into
      // the final else{} and was given ST.user.role='super_admin'. Now denied.
      if(!SESSION.employee){
        await denyAndSignOut('Your employee record could not be loaded. Contact your administrator.');
        return;
      }
      if(SESSION.employee.status==='offboarded'){
        await denyAndSignOut('Access revoked — your last working day has passed.');
        return;
      }
      ST.user={email:SESSION.profile.email,role:'employee',name:SESSION.employee.full_name,empId:SESSION.employee.id};
    } else if(actualRole==='admin'){
      ST.user={email:SESSION.profile.email,role:'admin',name:SESSION.profile.full_name||SESSION.profile.email};
    } else { // 'super_admin' (the only remaining value that passed the checks above)
      ST.user={email:SESSION.profile.email,role:'super_admin',name:'Super Admin'};
      SA_STATE.tab='clients';
    }
    gP(actualRole==='super_admin'?'super-admin':(actualRole==='admin'?'dashboard':'emp-home'));
    if(actualRole==='admin' && SESSION.access && SESSION.access.status==='trial' && typeof SESSION.access.days_left==='number'){
      const d=SESSION.access.days_left;
      setTimeout(()=>{ try{ toast('Free trial: '+(d>0?d+' day'+(d===1?'':'s')+' left':'last day today'),'info',4000); }catch(_){} },700);
    }
  } catch(ex){
    // Network/CORS/unexpected throw: if sign-in had already succeeded, don't
    // leave a half-initialised session behind.
    console.error('[NexaWage] Unexpected login exception:', ex);
    await denyAndSignOut('Unexpected error — open DevTools console for details.');
  } finally{
    const b=document.getElementById('LOGIN-BTN');   // fresh lookup: re-render replaced the old button
    if(b){ b.disabled=false; b.textContent=t('signIn'); }
  }
}

function regCountryChanged(){
  const c=(document.getElementById('R_CT')||{}).value;

async function doRegister(){
  const $=id=>document.getElementById(id);
  const v=id=>($(id)||{}).value||'';
  const showErr=m=>{ const el=$('REGERR'); if(el){ el.style.display='block'; el.textContent=m; } };
  const el0=$('REGERR'); if(el0) el0.style.display='none';

  const body={
    company_name:v('R_CO').trim(), admin_name:v('R_NM').trim(),
    email:v('R_EM').trim().toLowerCase(), password:v('R_PW'),
    country:v('R_CT'), currency:v('R_CU'),
    website:v('R_WEB')                       // honeypot, must stay empty
  };
  // Quick UX checks only; the Edge Function re-validates everything.
  if(body.company_name.length<2) return showErr('Enter your company name.');
  if(body.admin_name.length<2) return showErr('Enter your name.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(body.email)) return showErr('Enter a valid email address.');
  if(body.password.length<8||!/[A-Za-z]/.test(body.password)||!/\d/.test(body.password))
    return showErr('Password must be at least 8 characters with a letter and a number.');

  const btn=$('REG-BTN');
  if(btn){ btn.disabled=true; btn.textContent='Creating your company…'; }
  try{
    const res=await fetch(SUPABASE_URL+'/functions/v1/register-tenant',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPABASE_ANON_KEY,'Authorization':'Bearer '+SUPABASE_ANON_KEY},
      body:JSON.stringify(body)
    });
    const data=await res.json().catch(()=>({}));
    if(!res.ok){ showErr(data.error||('Registration failed ('+res.status+'). Please try again.')); return; }

    // Company created. Remember the country locally, then sign in through the
    // normal doLogin() so the Admin-portal role check and session setup all run.
    try{ const st=gS(); st.country=body.country; sS(st); }catch(_){}
    try{ toast('Company created! Signing you in…','success'); }catch(_){}
    ST.authMode='login'; ST.loginMode='admin'; render();
    const le=$('LE'), lp=$('LP');
    if(le) le.value=body.email;
    if(lp) lp.value=body.password;
    await doLogin();
  }catch(ex){
    console.error('[NexaWage] register failed:', ex);
    showErr('Could not reach the server. Check your internet connection and try again.');
  }finally{
    const b=$('REG-BTN');                    // only exists if we are still on the form
    if(b){ b.disabled=false; b.textContent='Start 14-Day Free Trial →'; }
  }
}

function startClock(){
  if(clockTmr)clearInterval(clockTmr);
  const tickClock=()=>{
    const cc=getCC();
    const locale=cc.locale||'en-US';
    const tz=cc.timeZone||'UTC';
    const timeOpts={hour:'2-digit',minute:'2-digit',second:'2-digit',timeZone:tz};
    const c=document.getElementById('CLOCK');if(c)c.textContent=new Date().toLocaleTimeString(locale,timeOpts);
    const e=document.getElementById('EL');if(e&&ST.clockedIn&&ST.clockInTime){ST.clockElapsed=Math.floor((Date.now()-ST.clockInTime)/1000);e.textContent=fmtE(ST.clockElapsed);}
    const c2=document.getElementById('CLOCK2');if(c2)c2.textContent=new Date().toLocaleTimeString(locale,timeOpts);
  };
  tickClock();
  clockTmr=setInterval(tickClock,1000);
}

function pgDashboard(){

  // Supabase data) instead of gS(). Chained lazy-loads: each missing
  // cache kicks off its own fetch and shows a loading state; once the
  // last one lands, render() is called again and this function runs
  // all-cache-hit, computing the real figures.
  if(_SB_CACHE.employees===null){ _loadEmployeesCache(); return `<div class="empty">Loading dashboard…</div>`; }
  if(_SB_CACHE.salaryConfigs===null){ _loadSalaryConfigsCache(); return `<div class="empty">Loading dashboard…</div>`; }
  if(_SB_CACHE.attendance===null){ _loadAttendanceCache(); return `<div class="empty">Loading dashboard…</div>`; }
  if(_SB_CACHE.leaves===null){ _loadLeavesCache(); return `<div class="empty">Loading dashboard…</div>`; }
  if(_SB_CACHE.expenses===null){ _loadExpensesCache(); return `<div class="empty">Loading dashboard…</div>`; }
  const m=new Date().getMonth()+1,y=new Date().getFullYear();
  const emps=_SB_CACHE.employees.filter(e=>e.isActive&&e.role!=='admin');

  emps.forEach(e=>{const cfg=_mapSalRow(_SB_CACHE.salaryConfigs[e.id]);const c=calcEmpPayroll({...e,sal:cfg},m,y);totalGross+=c.gross;totalNet+=c.net;});

      <div style="font-family:'Syne',sans-serif;font-size:22px;font-weight:800;color:var(--am)">${pendingLeaves}</div>

// SUPABASE: Salary Config — sourced from _SB_CACHE.employees +
// _SB_CACHE.salaryConfigs (salary_configs table) instead of the old
// emp.sal mock field. The schema doesn't have separate columns for
// bonus/esiRate/ptAmt/customDedNote, so those are packed into the
// existing `custom_deductions` jsonb column as a small settings
// object — pragmatic reuse of a flexible column rather than another
// migration round-trip.
function _mapSalRow(row){
  if(!row) return {};
  const extra = row.custom_deductions || {};
  return {
    basic:row.basic||0, hra:row.hra||0, special:row.allowances||0, bonus:extra.bonus||0,
    pfMode:row.pf_mode||'percent', pfVal:row.pf_val||12, pfCap: row.pf_cap!=null,
    esiEnabled:row.esi_enabled||false, esiRate:extra.esiRate||0.75,
    ptEnabled:row.pt_enabled||false, ptAmt:extra.ptAmt||200,
    tdsEnabled:row.tds_enabled||false, customDed:extra.customDed||0, customDedNote:extra.customDedNote||''
  };
}
function _loadSalaryConfigsCache(){
  if(_SB_CACHE.salaryConfigsLoading) return;
  _SB_CACHE.salaryConfigsLoading = true;
  DB.getAllSalaryConfigs().then(map=>{
    _SB_CACHE.salaryConfigs = map;
    _SB_CACHE.salaryConfigsLoading = false;
    render(); // always refresh, whatever page is currently showing
  }).catch(err=>{
    _SB_CACHE.salaryConfigsLoading = false;
    console.error('[NexaWage] getAllSalaryConfigs failed:', err);
    toast('Failed to load salary configs: '+err.message, 'error');
  });
}

function readSalForm(empId){
  const g=(id,fb=0)=>{const el=document.getElementById(id);if(!el)return fb;return el.type==='checkbox'?el.checked:(parseFloat(el.value)||fb);};
  const gs=(id,fb='')=>{const el=document.getElementById(id);return el?el.value:fb;};
  return{
    basic:g('f-basic-'+empId),hra:g('f-hra-'+empId),special:g('f-special-'+empId),
    bonus:g('f-bonus-'+empId),pfMode:gs('f-pfmode-'+empId,'percent'),
    pfVal:g('f-pfval-'+empId,12),pfCap:g('f-pfcap-'+empId),
    esiEnabled:g('f-esi-'+empId),esiRate:g('f-esirate-'+empId,0.75),
    ptEnabled:g('f-pt-'+empId),ptAmt:g('f-ptamt-'+empId,200),
    tdsEnabled:g('f-tds-'+empId),customDed:g('f-cusded-'+empId),
    customDedNote:gs('f-cusnote-'+empId),
  };
}
function livePreview(empId){
  const all=_SB_CACHE.employees||[];const emp=all.find(e=>e.id===empId);if(!emp)return;
  const baseCfg=_mapSalRow((_SB_CACHE.salaryConfigs||{})[empId]);
  const tmpSal=readSalForm(empId);
  const tmpEmp={...emp,sal:{...baseCfg,...tmpSal}};
  const m=new Date().getMonth()+1,y=new Date().getFullYear();
  const calc=calcEmpPayroll(tmpEmp,m,y);
  const prev=document.getElementById('PREV-'+empId);
  if(prev)prev.innerHTML=renderPreview(tmpEmp,calc);
  const hdr=document.getElementById('NET-'+empId);
  if(hdr)hdr.textContent=fINR(calc.net);
}
// SUPABASE: writes a new row to `salary_configs` (kept as history via
// effective_date, matching the schema design) instead of mutating
// emp.sal in place. bonus/esiRate/ptAmt/customDedNote are packed into
// custom_deductions jsonb since the schema has no dedicated columns.
async function saveSalaryConfig(empId){
  const all=_SB_CACHE.employees||[];const emp=all.find(e=>e.id===empId);
  if(!emp){toast('Employee not found','error');return;}
  const form=readSalForm(empId);
  const btn=document.getElementById('SC-BTN-'+empId);
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  try{
    const row = await DB.saveSalaryConfig({
      employee_id: empId,
      basic: form.basic, hra: form.hra, allowances: form.special,
      pf_mode: form.pfMode, pf_val: form.pfVal, pf_cap: form.pfCap ? 1800 : null,
      esi_enabled: !!form.esiEnabled, pt_enabled: !!form.ptEnabled, tds_enabled: !!form.tdsEnabled,
      custom_deductions: { bonus: form.bonus, esiRate: form.esiRate, ptAmt: form.ptAmt, customDed: form.customDed, customDedNote: form.customDedNote },
      effective_date: todayStr()
    });
    if(_SB_CACHE.salaryConfigs) _SB_CACHE.salaryConfigs[empId] = row; // optimistic local update, avoids full re-render/collapsing the accordion
    const m=new Date().getMonth()+1,y=new Date().getFullYear();
    const calc=calcEmpPayroll({...emp,sal:_mapSalRow(row)},m,y);
    const hdr=document.getElementById('NET-'+empId);
    if(hdr)hdr.textContent=fINR(calc.net);
    toast(emp.name.split(' ')[0]+' salary settings saved! ✓','success');
  }catch(e){
    console.error('[NexaWage] saveSalaryConfig failed:',e);
    toast('Save failed: '+e.message,'error');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='💾 Save — '+emp.name.split(' ')[0]+"'s Settings";}
  }
}

// SUPABASE MIGRATION STATUS — everything below is now converted.
// Auth (doLogin/doLogout/bootSession), RBAC guard (gP/canAccess),
// attendance clock-in/out, employee profile (getMyEmp) + full CRUD,
// salary config, payroll runs + payslips, leaves, loans, and expenses
// all read/write Supabase via the `DB` object and the _SB_CACHE
// stale-while-revalidate pattern defined above. The only remaining
// gS()/sS() (localStorage) usage is in pages not covered by this
// conversation's schema: Dashboard stats, admin Attendance view,
// Department Browser, Shift Management, and Super Admin console —
// same conversion pattern applies if those are needed next.
// ------------------------------------------------------------
// SUPABASE: Employee CRUD — converted from gS()/sS() to a real
// Supabase-backed cache. render() is synchronous end-to-end (see
// renderShell's `pages[ST.page]()` dispatch above), so instead of
// making the whole render chain async, this uses a simple
// stale-while-revalidate cache: the page function returns a loading
// skeleton immediately, kicks off an async DB.getEmployees() fetch in
// the background, and calls render() again once data arrives.
const _SB_CACHE = { employees: null, employeesLoading: false, salaryConfigs: null, salaryConfigsLoading: false, payrollRuns: null, payrollRunsLoading: false, myPayslips: null, myPayslipsLoading: false, leaves: null, leavesLoading: false, loans: null, loansLoading: false, expenses: null, expensesLoading: false, tenants: null, tenantsLoading: false, tenantEmpCounts: null,
  attendance: null, attendanceLoading: false, myAttendance: null, myAttendanceLoading: false,
  featureFlags: null, featureFlagsLoading: false,
  broadcasts: null, broadcastsLoading: false,
  complianceCountries: null, complianceCountriesLoading: false,
  customLanguages: null, customLanguagesLoading: false,
  invoices: null, invoicesLoading: false };

// ══════════════════════════════════════════════════════
// SUPABASE: Super Admin — real tenants (replaces the old
// localStorage-only demo list for the Clients tab + Manage
// Billing modal). Loaded once per session, same lazy-cache
// pattern as _loadSalaryConfigsCache() above: render a
// "Loading…" placeholder, kick off the fetch, then re-render
// once data lands.
// ══════════════════════════════════════════════════════
function _loadTenantsCache(){
  if(_SB_CACHE.tenantsLoading) return;
  _SB_CACHE.tenantsLoading = true;
  Promise.all([
    DB.getAllTenants(),
    sb.from('employees').select('tenant_id') // super_admin RLS policy allows reading across all tenants
  ]).then(([tenants, empRes])=>{
    if(empRes.error) throw empRes.error;
    const counts = {};
    (empRes.data||[]).forEach(r=>{ counts[r.tenant_id] = (counts[r.tenant_id]||0) + 1; });
    _SB_CACHE.tenants = tenants || [];
    _SB_CACHE.tenantEmpCounts = counts;
    _SB_CACHE.tenantsLoading = false;
    render(); // always refresh, whatever page is currently showing
  }).catch(err=>{
    _SB_CACHE.tenantsLoading = false;
    console.error('[NexaWage] loadTenants failed:', err);
    toast('Failed to load tenants: '+err.message, 'error');
  });
}
// Maps a raw `tenants` row to the field names the existing render
// functions expect (totalEmployees, headcountLimit, etc.), since
// this schema doesn't track adminName/adminEmail/features at the
// tenant level (those were fields on the old fake demo objects).
function _realTenantView(row){
  return Object.assign({}, row, {
    totalEmployees: (_SB_CACHE.tenantEmpCounts && _SB_CACHE.tenantEmpCounts[row.id]) || 0,
    headcountLimit: row.headcount_limit,
    registeredAt: row.created_at,
    trialEnd: row.trial_end,
  });
}

function _mapEmpRow(r){
  // FIX: r.shift comes from Postgres as lowercase ('morning'/'evening'/
  // 'night'/'general'), but the SHIFTS constant's keys are capitalized
  // ('Morning'/'Evening'/'Night'/'General') — without this conversion,
  // SHIFTS[r.shift] was always undefined and silently fell back to
  // General for every employee, regardless of their real assigned shift
  // (this also broke overtime-hours calculation, which reads shift.hours).
  const shiftCap = r.shift ? r.shift.charAt(0).toUpperCase()+r.shift.slice(1) : 'General';
  return {
    id: r.id, name: r.full_name, dept: r.department || '—', subDept: r.sub_department || '',
    jobRole: r.job_role || '', shift: shiftCap, isActive: r.is_active,
    email: r.email, phone: r.phone || '', city: '', joinDate: r.join_date,
    bank: r.bank_account_no ? { name:r.full_name, accNo:r.bank_account_no, ifsc:r.bank_ifsc, bank:r.bank_name, type:'Savings' } : null,
    offboarding: (r.status==='notice'||r.status==='offboarded') ? { status:r.status, lwd:r.last_working_day } : null,
    bgvStatus: r.bgv_status || 'pending',
    role: 'employee' // legacy field some filters check (e.filter(e=>e.role!=='admin'))
  };
}
// SUPABASE: real `attendance` table, one flat array (not keyed by
// employee like the old gS().attendance blob) — filtered per-employee
// on read via _attRecsFor(). Reused by the Dashboard, Payroll calc
// engine, and the Admin Attendance page itself.

  if(_SB_CACHE.attendanceLoading) return;

}
function _loadEmployeesCache(){
  if(_SB_CACHE.employeesLoading) return;

// then calls the create-employee-user Edge Function to create the
// matching Auth login + profiles row using the service-role key —
// which only ever runs server-side inside the Edge Function, never in
// this browser code. See supabase-functions/create-employee-user/index.ts.
async function saveNewEmp(){
  const g=(id)=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  const name=g('SF-name'),email=g('SF-email'),pass=g('SF-pass');
  if(!name||!email){toast('Name and email are required','error');return;}
  if(!pass||pass.length<6){toast('Password must be at least 6 characters','error');return;}
  const btn=document.getElementById('SF-btn');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  try{
    const empRow = await DB.upsertEmployee({
      full_name:name, email, phone:g('SF-phone')||null,
      department:g('SF-dept')||getDeptNames()[0], sub_department:g('SF-sub')||null,
      job_role:g('SF-role')||null, shift:g('SF-shift')||'morning',
      join_date:g('SF-join')||todayStr(), is_active:true, status:'active'
    });
    try{
      await callCreateEmployeeUser({ email, password:pass, full_name:name, tenant_id:DB.tenantId(), role:'employee', employee_id:empRow.id });
      toast('✅ '+name+' added with login ready — share the password with them','success');
    }catch(loginErr){
      // Employee record still saved — just the login creation failed
      // (e.g. Edge Function not deployed yet, or email already registered).
      console.error('[NexaWage] create-employee-user failed:',loginErr);
      toast(name+' added, but login creation failed: '+loginErr.message,'error');
    }
    closeSheet(); _refreshEmployees();
  }catch(e){
    console.error('[NexaWage] saveNewEmp failed:',e);
    toast('Failed to add employee: '+e.message,'error');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='✅ Add Employee';}
  }
}

function pgAttendance(){
  if(_SB_CACHE.employees===null){ _loadEmployeesCache(); return `<div class="empty">Loading…</div>`; }
  if(_SB_CACHE.attendance===null){ _loadAttendanceCache(); return `<div class="empty">Loading…</div>`; }
  const today=todayStr();
  const emps=_SB_CACHE.employees.filter(e=>e.isActive&&e.role!=='admin');
  const m=new Date().getMonth()+1,y=new Date().getFullYear();
  const wdays=getWorkingDays(y,m);

  const stats=emps.map(e=>{
    const recs=_attRecsFor(e.id,m,y);
    const present=recs.filter(a=>a.status==='present').length;
    const absent=recs.filter(a=>a.status==='absent').length;
    const half=recs.filter(a=>a.status==='half').length;
    const leave=recs.filter(a=>a.status==='leave').length;
    const todayRec=recs.find(a=>a.date===today);
    const totalOt=recs.reduce((sum,r)=>sum+(r.ot_hours||Math.max(0,(r.hours_worked||0)-(SHIFTS[e.shift||'General']||SHIFTS.General).hours)),0);
    return{emp:e,present,absent,half,leave,todayRec,totalOt:parseFloat(totalOt.toFixed(2))};
  });
  const presentToday=stats.filter(s2=>s2.todayRec&&s2.todayRec.status==='present').length;
  const absentToday=stats.filter(s2=>!s2.todayRec||s2.todayRec.status==='absent').length;
  const totalOtHours=stats.reduce((sum,s2)=>sum+s2.totalOt,0);

  return`
  <div class="section-hdr"><div class="section-title">${t('attendanceTitle')}</div><span class="dept">${MONTHS[m]} ${y}</span></div>
  <div class="sg">
    <div class="stat grn"><div class="stat-lbl">Present Today</div><div class="stat-val">${presentToday}</div></div>
    <div class="stat amb"><div class="stat-lbl">Absent Today</div><div class="stat-val">${absentToday}</div></div>
    <div class="stat ind"><div class="stat-lbl">Working Days</div><div class="stat-val">${wdays}</div></div>
    <div class="stat pur"><div class="stat-lbl">Total OT Hours</div><div class="stat-val">${totalOtHours.toFixed(1)}h</div></div>
  </div>
  <div class="card">
    <div class="card-title">📅 ${t('markAttendance')}</div>
    ${stats.map((st,i)=>{
      const rec=st.todayRec;
      const sh=SHIFTS[st.emp.shift||'General']||SHIFTS.General;
      return`<div class="li">
        ${av(st.emp.name,i,'sm')}
        <div class="li-body">
          <div class="li-title">${st.emp.name} ${st.emp.shift&&st.emp.shift!=='General'?`<span class="${sh.class}" style="font-size:9px;padding:1px 5px;border-radius:20px">${sh.icon}</span>`:''}</div>
          <div style="font-size:10.5px;color:var(--tx3)">${st.present}P · ${st.absent}A · ${st.half}HD${st.totalOt?` · <span style="color:var(--gr)">⚡${st.totalOt}h OT</span>`:''}</div>
        </div>
        <div class="li-right" style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
          ${rec?badge(ATT_STATUS_FROM_DB[rec.status]||'Present'):'<span class="badge b-absent">Absent</span>'}
          <button class="btn btn-s btn-sm" style="font-size:10px;padding:3px 8px" onclick="openMarkAttendance('${st.emp.id}')">✏️ Mark</button>
        </div>
      </div>`;}).join('')}
  </div>
  <div class="card">
    <div class="card-title">📋 Add Custom Record</div>
    <div class="fg"><label class="fl">Employee</label>
      <select class="fi" id="AT-emp">
        ${emps.map(e=>`<option value="${e.id}">${e.name}</option>`).join('')}
      </select>
    </div>
    <div class="fgrid3">
      <div class="fg"><label class="fl">Date</label><input class="fi" id="AT-date" type="date" value="${today}"/></div>
      <div class="fg"><label class="fl">Check-In</label><input class="fi" id="AT-in" type="time" value="09:00"/></div>
      <div class="fg"><label class="fl">Check-Out</label><input class="fi" id="AT-out" type="time" value="18:00"/></div>
    </div>
    <div class="fg"><label class="fl">Status</label>
      <select class="fi" id="AT-status">
        ${['Present','Absent','Half-Day','On Leave'].map(s2=>`<option>${s2}</option>`).join('')}
      </select>
    </div>
    <button class="btn btn-p mt3" id="AT-save-btn" onclick="saveAdminAttendance()">✅ Save Record</button>
  </div>`;
}

async function saveQuickMark(empId){
  const g=(id)=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  const date=g('QM-date')||todayStr();
  const statusUI=g('QM-status')||'Present';
  const checkIn=g('QM-in');const checkOut=g('QM-out');
  const hours=parseFloat(g('QM-hours'))||9;
  const emp=(_SB_CACHE.employees||[]).find(e=>e.id===empId);
  const shHours=(SHIFTS[emp?.shift||'General']||SHIFTS.General).hours;
  const otHours=statusUI==='Present'?Math.max(0,hours-shHours):0;
  const btn=document.getElementById('QM-save-btn');
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  try{
    const row=await DB.upsertAttendance({employeeId:empId,date,status:ATT_STATUS_TO_DB[statusUI],checkIn,checkOut,hours,otHours});
    if(_SB_CACHE.attendance){
      const idx=_SB_CACHE.attendance.findIndex(a=>a.employee_id===empId&&a.date===date);
      if(idx>=0)_SB_CACHE.attendance[idx]=row;else _SB_CACHE.attendance.push(row);
    }
    toast('Attendance saved ✓','success');closeSheet();render();
  }catch(e){

async function saveAdminAttendance(){

// FINTECH: markPaid now does two things — (1) ensures a payroll_runs
// row exists with the calculated numbers (as before), then (2) calls
// the initiate-payout Edge Function, which talks to RazorpayX and
// sends a REAL bank transfer. Status only becomes 'paid' once the
// razorpayx-webhook function confirms it — this button sets it to
// 'processing' and stops there; it does NOT claim money has arrived.
async function markPaid(empId,month,year){
  if(year>new Date().getFullYear()||(year===new Date().getFullYear()&&month>new Date().getMonth()+1)){toast('Cannot run payroll for a future month','error');return;}
  const emp=(_SB_CACHE.employees||[]).find(e=>e.id===empId);if(!emp)return;
  if(!emp.bank||!emp.bank.accNo||!emp.bank.ifsc){
    toast(emp.name+' has no bank details on file — add them first','error');return;
  }
  if(!confirm(`Send a REAL bank transfer to ${emp.name} for ${MONTHS[month]} ${year}? This cannot be undone.`)) return;
  const cfg=_mapSalRow((_SB_CACHE.salaryConfigs||{})[empId]);
  const c=calcEmpPayroll({...emp,sal:cfg},month,year);
  const btn=document.getElementById('MP-'+empId);
  if(btn){btn.disabled=true;btn.textContent='Sending…';}
  try{
    const row = await DB.runPayroll({ employeeId:empId, month, year, gross:c.totalEarnings, deductions:c.totalDed, net:c.net, breakdown:c });
    const result = await callInitiatePayout(row.id);
    const updated = result.payroll_run || row;
    if(_SB_CACHE.payrollRuns){
      const idx=_SB_CACHE.payrollRuns.findIndex(p=>p.id===updated.id);
      if(idx>=0) _SB_CACHE.payrollRuns[idx]=updated; else _SB_CACHE.payrollRuns.unshift(updated);
    }
    toast(emp.name+' — bank transfer sent, awaiting bank confirmation (processing) ⏳','success');
    render();
  }catch(e){
    console.error('[NexaWage] markPaid/payout failed:',e);
    toast('Payout failed: '+e.message,'error');
    if(btn){btn.disabled=false;btn.textContent='💸 Pay via Bank';}
  }
}
// FINTECH: calls the initiate-payout Edge Function — never contains a
// RazorpayX key of any kind; those live only in the Edge Function's
// server-side secrets. Sends the admin's own session token so the
// function can verify the caller is actually authorized.
async function callInitiatePayout(payrollRunId){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) throw new Error('Not logged in');
  const res = await fetch(SUPABASE_URL+'/functions/v1/initiate-payout', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token },
    body: JSON.stringify({ payroll_run_id: payrollRunId })
  });
  const json = await res.json();
  if(!res.ok) throw new Error(json.error || 'Payout request failed ('+res.status+')');
  return json;
}
// FINTECH: safety net for missed webhooks (e.g. manually cancelling a
// payout from the RazorpayX dashboard sends no webhook at all — see
// sync-payout-status/index.ts). Directly asks RazorpayX for the real
// status of every payslip still stuck 'processing' and reconciles it.
async function syncPayoutStatus(){
  const btn=document.getElementById('SYNC-BTN');
  if(btn){btn.disabled=true;btn.textContent='Syncing…';}
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if(!session) throw new Error('Not logged in');
    const res = await fetch(SUPABASE_URL+'/functions/v1/sync-payout-status', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+session.access_token }
    });
    const json = await res.json();
    if(!res.ok) throw new Error(json.error || 'Sync failed ('+res.status+')');
    toast(`🔄 Checked ${json.checked}, updated ${json.updated}`, json.updated>0?'success':'info');
    if(json.updated>0){ _SB_CACHE.payrollRuns=null; render(); }
  }catch(e){
    console.error('[NexaWage] syncPayoutStatus failed:',e);
    toast('Sync failed: '+e.message,'error');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='🔄 Sync Payout Status';}
  }
}
// FINTECH: bulk payout — sends a REAL bank transfer to every active
// employee without an existing processing/paid run this month.
// Skips employees with no bank details on file rather than failing
// the whole batch, and reports skipped/failed counts so nothing
// silently fails to pay someone.
async function runAllPayroll(month,year){
  if(year>new Date().getFullYear()||(year===new Date().getFullYear()&&month>new Date().getMonth()+1)){toast('Cannot run payroll for a future month','error');return;}
  const emps=(_SB_CACHE.employees||[]).filter(e=>e.isActive&&e.role!=='admin');
  const runs=_SB_CACHE.payrollRuns||[];
  const eligible=emps.filter(emp=>!runs.find(p=>p.employee_id===emp.id&&p.month===month&&p.year===year&&['processing','paid'].includes(p.payout_status)));
  if(!eligible.length){ toast('Nothing to pay — all employees already processed this month','info'); return; }
  if(!confirm(`Send REAL bank transfers to ${eligible.length} employee(s) for ${MONTHS[month]} ${year}? This cannot be undone.`)) return;
  const btn=document.getElementById('RUN-ALL-BTN');
  if(btn){btn.disabled=true;btn.textContent='Processing…';}
  let paid=0,skipped=0,failed=0;
  try{
    for(const emp of eligible){
      if(!emp.bank||!emp.bank.accNo||!emp.bank.ifsc){ skipped++; continue; }
      try{
        const cfg=_mapSalRow((_SB_CACHE.salaryConfigs||{})[emp.id]);
        const c=calcEmpPayroll({...emp,sal:cfg},month,year);
        const row = await DB.runPayroll({ employeeId:emp.id, month, year, gross:c.totalEarnings, deductions:c.totalDed, net:c.net, breakdown:c });
        const result = await callInitiatePayout(row.id);
        const updated = result.payroll_run || row;
        const idx=runs.findIndex(p=>p.id===updated.id);
        if(idx>=0) runs[idx]=updated; else runs.unshift(updated);
        paid++;
      }catch(innerErr){
        console.error('[NexaWage] payout failed for',emp.name,innerErr);
        failed++;
      }
    }
    toast(`💸 ${paid} sent, ${skipped} skipped (no bank details), ${failed} failed — ${MONTHS[month]} ${year}`, failed?'error':'success');
    render();
  }catch(e){
    console.error('[NexaWage] runAllPayroll failed:',e);
    toast('Failed partway through: '+e.message,'error');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='⚡ '+t('processAll');}
  }
}
// SUPABASE: securely fetches the payslip PDF. Never stores a

function pgLeaves(){
  if(_SB_CACHE.employees===null){ _loadEmployeesCache(); return `<div class="empty">Loading employees…</div>`; }

  const leaves=_SB_CACHE.leaves;
  const pending=leaves.filter(l=>l.status==='pending');

function calcLoanPreview(){
  const amt=parseFloat(document.getElementById('LN-amount')?.value||0);
  const tenure=parseInt(document.getElementById('LN-tenure')?.value||1);
  const emi=tenure>0?Math.ceil(amt/tenure):amt;
  const el=document.getElementById('LN-EMI-PREVIEW');
  if(el)el.textContent=fINR(emi)+'/month × '+tenure+' months';
}
async function saveLoan(){
  const g=(id)=>{const e=document.getElementById(id);return e?e.value.trim():'';};
  const empId=g('LN-emp'),amount=parseFloat(g('LN-amount')),purpose=g('LN-purpose'),tenure=parseInt(g('LN-tenure')||10);
  if(!empId||!amount||!tenure){toast('All fields required','error');return;}
  const emi=Math.ceil(amount/tenure);
  const btn=document.getElementById('LN-btn');
  if(btn){btn.disabled=true;btn.textContent='Disbursing…';}
  try{
    const row = await DB.requestLoan({ employee_id:empId, principal:amount, emi_amount:emi, tenure_months:tenure, status:'approved' });
    if(_SB_CACHE.loans) _SB_CACHE.loans.unshift(row);
    toast('Loan disbursed ✓ EMI: '+fINR(emi)+'/month','success');closeSheet();render();
  }catch(e){
    console.error('[NexaWage] saveLoan failed:',e);
    toast('Failed: '+e.message,'error');
  }finally{
    if(btn){btn.disabled=false;btn.textContent='💳 Disburse Loan';}
  }
}
async function recordEMI(loanId){
  const btn=document.getElementById('EMI-'+loanId);
  if(btn){btn.disabled=true;btn.textContent='Saving…';}
  try{
    const row = await DB.recordLoanEMI(loanId);
    if(_SB_CACHE.loans){ const idx=_SB_CACHE.loans.findIndex(l=>l.id===loanId); if(idx>=0) _SB_CACHE.loans[idx]=row; }

    toast('Failed: '+e.message,'error');
    if(btn){btn.disabled=false;btn.textContent='+ Record EMI';}
  }
}

// (`alter type shift_type add value 'general'`), which must be run
// before assigning General to anyone.
async function assignShift(empId,shift){
  const emp=(_SB_CACHE.employees||[]).find(e=>e.id===empId);if(!emp)return;
  try{

function getMyEmp(){
  // SUPABASE: getMyEmp() now prefers the real Supabase employee record
  // (SESSION.employee, set at login) over the old localStorage mock.
  // Field names are mapped to the shape the rest of the app expects
  // (name/dept/jobRole/isActive/shift) so pages like pgEmpHome don't
  // need to be rewritten just to stop saying "Profile not found".
  // NOTE: `sal` (salary config) is left empty here — salary_configs
  // hasn't been wired into calcEmpPayroll() yet, so payroll figures

  if(SESSION.employee){
    const e=SESSION.employee;
    return {
      id:e.id, name:e.full_name, dept:e.department, subDept:e.sub_department,
      jobRole:e.job_role, shift:e.shift?e.shift.charAt(0).toUpperCase()+e.shift.slice(1):'General', isActive:e.is_active,

}

function doGeoTag(){
  if(location.protocol!=='https:'&&location.hostname!=='localhost'){toast('Location only works when the app is opened from an https link, not from a saved file','error',6000);return;}
  if(!navigator.geolocation){toast('Geolocation not available on this device','error');return;}
  if(!SESSION.employee){toast('No employee profile linked to this account','error');return;}
  const wait=toast('Getting location...','info',15000);
  navigator.geolocation.getCurrentPosition(async pos=>{
    if(wait)wait.remove();
    const {latitude:lat,longitude:lng,accuracy}=pos.coords;
    try{
      const { data:row } = await sb.from('attendance').select('id').eq('employee_id',SESSION.employee.id).eq('date',localDate()).maybeSingle();
      if(!row){toast('Clock in first, then geo-tag your attendance','error');return;}
      const { error } = await sb.from('attendance').update({ geo_location:{lat,lng,accuracy:Math.round(accuracy),time:new Date().toISOString()} }).eq('id',row.id);
      if(error) throw error;
      toast('📍 Geo tagged: '+lat.toFixed(4)+', '+lng.toFixed(4),'success');
    }catch(e){toast('Could not save location: '+e.message,'error');}
  },err=>{
    if(wait)wait.remove();
    toast(err.code===1?'Location permission denied — allow it in browser/site settings':(err.code===3?'Location timed out — try again with GPS on':'Could not get location'),'error');
  },{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
}

// Loaded lazily on first use (not on page load) so the ~190KB model
// only downloads for employees who actually try Face Check-In.
// tinyFaceDetector is the lightest face-api.js model — plenty for
// "is a face present", far cheaper than a full landmark/recognition
// net. Note this DETECTS a face; it does not RECOGNIZE whose face it
// is (that needs enrolled reference photos per employee, which this
// build doesn't have) — the status copy below says "face detected",
// never "identity confirmed", so it doesn't overclaim what it checked.
let _faceModelsPromise=null;
const FACE_MODELS_URL='https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js/weights/';
function loadFaceModels(){
  if(!_faceModelsPromise)_faceModelsPromise=faceapi.nets.tinyFaceDetector.loadFromUri(FACE_MODELS_URL);
  return _faceModelsPromise;
}
async function startFaceRecog(){
  const vid=document.getElementById('FACE-VID');
  const st=document.getElementById('FACE-ST');
  const pg=document.getElementById('FACE-PG');
  if(typeof faceapi==='undefined'){
    if(st)st.textContent='Face detection failed to load — check your connection and try again.';
    return;
  }
  if(!navigator.mediaDevices?.getUserMedia){
    if(st)st.textContent='Camera not available on this device.';
    return;
  }
  try{
    if(st)st.textContent='Loading face detector…';
    const [stream]=await Promise.all([
      navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}}),
      loadFaceModels()
    ]);
    if(vid){vid.srcObject=stream;await vid.play().catch(()=>{});}
    if(st)st.textContent='Looking for a face…';
    runFaceScan(vid,st,pg);
  }catch(err){
    console.error('[NexaWage] face recog init failed:',err);
    if(st)st.textContent=err.name==='NotAllowedError'
      ?'Camera permission denied — allow it in browser/site settings.'
      :'Could not start camera: '+err.message;
  }
}
function runFaceScan(vid,st,pg){
  const REQUIRED_HITS=5;      // consecutive positive frames needed before we trust it — cuts down false triggers from a stray shadow or motion blur
  const TIMEOUT_MS=20000;     // don't leave someone staring at the camera forever if the light is bad
  const opts=new faceapi.TinyFaceDetectorOptions({inputSize:224,scoreThreshold:.5});
  let hits=0,done=false;
  const startedAt=Date.now();
  faceInterval=setInterval(async()=>{
    if(done||!vid||vid.readyState<2)return;
    let detection=null;
    try{detection=await faceapi.detectSingleFace(vid,opts);}catch(e){detection=null;}
    if(detection){
      hits++;
      if(st)st.textContent='Face detected — hold still…';
    }else{
      hits=Math.max(0,hits-1);
      if(st)st.textContent='Looking for a face…';
    }
    if(pg)pg.style.width=Math.min(100,Math.round(hits/REQUIRED_HITS*100))+'%';
    if(hits>=REQUIRED_HITS){
      done=true;clearInterval(faceInterval);
      if(st)st.textContent='✅ Face detected!';
      setTimeout(async()=>{closeFaceModal();await doClockIn();},400);
      return;
    }
    if(Date.now()-startedAt>TIMEOUT_MS){
      done=true;clearInterval(faceInterval);
      if(st)st.textContent='No face detected — try better lighting, or use the Clock In button instead.';
      setTimeout(closeFaceModal,2200);
    }
  },300);
}
function closeFaceModal(){
  clearInterval(faceInterval);
  const v=document.getElementById('FACE-VID');
  if(v?.srcObject)v.srcObject.getTracks().forEach(t=>t.stop());
  const el=document.getElementById('FACE-OVERLAY');if(el)el.remove();
}

async function changePassword(){
  const oldP=(document.getElementById('PW-old')||{}).value||'';
  const newP=(document.getElementById('PW-new')||{}).value||'';
  if(!oldP){toast('Enter your current password','error');return;}
  if(newP.length<6){toast('New password must be at least 6 characters','error');return;}
  try{
    const { error:e1 } = await sb.auth.signInWithPassword({ email:SESSION.profile.email, password:oldP });
    if(e1){toast('Current password is incorrect','error');return;}
    const { error:e2 } = await sb.auth.updateUser({ password:newP });
